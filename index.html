<!DOCTYPE html>
<html lang = "en">
<head>
    <meta charset="UTF-8">
    <meta name = "viewport" content="width=device-vidth, initial-scale=1.0">
    <title>Pixel</title>
    <style>
        body {
    width: 100vw;
    height: 100vh;
    margin: 0;
    padding: 0;
}
.field-container{
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    background-color: #242424;
}


.field{
    width: 60vw;
    height: 30vw;
    display: grid;
    grid-template-columns: repeat(30, 1fr);
    grid-template-rows: repeat(15, 1fr);
    gap: 1px;
}


.cell{
    background-color: #626262;
}


.red{
    background-color: #E15554;
}
.green{
    background-color: #3BB273;
}
.blue{
    background-color: #4D9DE0;
}
.yellow{
    background-color: #E1BC29;
}
.skyblue{
    background-color: #87CEEB;
}
.color-palette{
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 60vh;
    gap: 3px;
}
.color-cell{
    width: 15px;
    height: 15px;
}


.selected{
    width: 30px;
    height: 30px;
}
</style>
</head>
<body>
<div class = "field-container">
    <div class="color-palette">
        <div class = "color-cell red selected"></div>
        <div class = "color-cell green"></div>
        <div class = "color-cell blue"></div>
        <div class = "color-cell yellow"></div>
        <div class = "color-cell skyblue"></div>
        <div class = "color-cell eraser" style ="background-color:rgb(62,62,62)"></div>
        <div class = "color-cell save-tool" style ="background-color:blueviolet"></div>    
    </div>
    <div class="field"></div>
</div>
<script src= "https://cdnjs.cloudflare.com/ajax/libs/dom-to-image/2.6.0/dom-to-image.min.js"></script>
<script src = "script.js"></script>
<script>
    function get_result_from_cookie(){
    let cookies = document.cookie.split('; ')
    for (let i = 0; i<cookies.length; i+=1){
        let cookie = cookies[i].split('=')
        if (cookie[0] == 'pixel result'){
            return cookie[1]
        }
    }
    return "0"*450
}

let field = document.querySelector('.field')
let temp_result = get_result_from_cookie()
if (temp_result != '0'*450){
    for (let i=0; i<450; i+1){
        let cell = document.createElement('div')
        cell.classList.add('cell')
        cell.setAttribute('id',`&{i}`)
        cell.style.backgroundColor = COLORS[parseInt(temp_result[i])]
        filed.appendChild(cell) }
}else{
    for (let i = 0; i<450; i+=1){
        let cell = document.createElement('div')
        cell.setAttribute('id',`&{i}`)
        cell.classList.add('cell')
        field.appendChild(cell)
}}


var CURRENT_COLOR = "rgb(255, 102, 46)";
var DEFAULT_COLOR = "#626262";
var COLOR_MAP = {
    "red" : "rgb(255, 102, 46)",
    "green" : "rgb(26, 218, 84)",
    "blue" : "rgb(83, 15, 255)",
    "yellow" : "rgb(255, 236, 26)",
    "skyblue" : "rgb(142, 229, 255)"
};


let cells = document.querySelectorAll('.cell')
for (let i =0; i < cells.length;i++){
    let cell = cells[i];
    cell.addEventListener('click', function(){
        cell.style.backgroundColor = CURRENT_COLOR;
    })
    cell.addEventListener('mouseover',function(){
        if (IS_CLICKED){
            cell.style.backgroundColor = CURRENT_COLOR;
        }
    } )
    cell.addEventListener('mousedown', function(){
        cell.style.backgroundColor = CURRENT_COLOR;
    })


}
var IS_CLICKED = false;
document.addEventListener('mousedown', function(){
    IS_CLICKED = true;

})
document.addEventListener('mouseup', function(){
    IS_CLICKED = false;

})


let color_cells = document.querySelectorAll('.color-cell')
for (let i = 0; i<color_cells.length; i++){
    let color_cell = color_cells[i];
    color_cell.addEventListener('click', function(){
        let colorClass = "";
        if (color_cell.classList.contains("red")) colorClass = "red";
        else if (color_cell.classList.contains("green")) colorClass = "green";
        else if (color_cell.classList.contains("blue")) colorClass = "blue";
        else if (color_cell.classList.contains("yellow")) colorClass = "yellow";
        else if (color_cell.classList.contains("skyblue")) colorClass = "skyblue";
        CURRENT_COLOR = COLOR_MAP[colorClass];
        document.querySelector('.selected').classList.remove('selected')
        color_cell.classList.add('selected')
    })
}


var COLORS = [
    "rgb(62,62,62)",
    "rgb(255,102,46)",
    "rgb(26,218,84)",
    "rgb(83,15,255)",
    "rgb(255,236,26)",
    "rgb(142,229,255)"
];
setInterval(function(){
    let result = '';
    let temp_cells = document.querySelectorAll('.cell');
    for (let i = 0; i<temp_cells.length;i+=1){
        let cell = temp_cells[i];
        let color = cell.style.backgroundColor;


        let colorIndex = '0';
        for (let j = 0; j<COLORS.length; j++) {
            if (color === COLORS[j]){
                colorIndex = j.toString();
                break;
            }
        }
        result += colorIndex;
    }
    document.cookie = 'pixel-result='+result+';max-age=100000';
}, 60000);



document.querySelector(".save-tool").addEventListener('click', function(){
    domtoimage.toJpeg(field, {quality:2})
    .then(function (dataUrl){
        var img = new Image();
        img.scr = dataUrl;
        let link = document.createElement('a');
        link.download = 'pixel.jpg';
        link.href = dataUrl;
        link.click();
    })
    .catch(function (error){
        console.error('Ошибка', error)
    })
})

document.querySelector('.eraser').addEventListener('click', function(){
    CURRENT_COLOR = DEFAULT_COLOR
    document.querySelector('.selected').classList.remove('selected')
    this.classList.add('selected')
})
</script>
</body>
</html>
